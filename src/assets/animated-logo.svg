<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Animated Cooking Pot Logo -->
  <style>
    @keyframes steam-rise {
      0% { transform: translateY(0) scale(1); opacity: 0.8; }
      50% { transform: translateY(-15px) scale(1.1); opacity: 0.4; }
      100% { transform: translateY(-30px) scale(0.8); opacity: 0; }
    }
    @keyframes bubble {
      0% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 0.5; }
      100% { transform: scale(0.5); opacity: 0; }
    }
    @keyframes pot-shake {
      0%, 100% { transform: rotate(-1deg); }
      25% { transform: rotate(1deg); }
      50% { transform: rotate(-1deg); }
      75% { transform: rotate(1deg); }
    }
    @keyframes glow-pulse {
      0%, 100% { filter: drop-shadow(0 0 5px #FFB366); }
      50% { filter: drop-shadow(0 0 20px #FF8C00); }
    }
    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0); }
      50% { opacity: 1; transform: scale(1); }
    }
    @keyframes title-fade {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .steam {
      animation: steam-rise 2s ease-out infinite;
    }
    .steam:nth-child(2) { animation-delay: 0.3s; }
    .steam:nth-child(3) { animation-delay: 0.6s; }
    .bubble { animation: bubble 1.5s ease-out infinite; }
    .bubble:nth-child(2) { animation-delay: 0.5s; }
    .bubble:nth-child(3) { animation-delay: 1s; }
    .pot-group { animation: pot-shake 0.5s ease-in-out infinite; transform-origin: 100px 150px; }
    .glow { animation: glow-pulse 1.5s ease-in-out infinite; }
    .sparkle { animation: sparkle 1s ease-in-out infinite; }
    .sparkle:nth-of-type(2) { animation-delay: 0.3s; }
    .sparkle:nth-of-type(3) { animation-delay: 0.6s; }
    .title { animation: title-fade 0.8s ease-out 0.5s both; }
  </style>
  
  <!-- Background Glow -->
  <circle cx="100" cy="100" r="90" fill="url(#bgGradient)" class="glow" opacity="0.3"/>
  
  <!-- Steam -->
  <g class="steam">
    <path d="M70 65 Q75 50 70 35" stroke="#FFB366" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>
  <g class="steam">
    <path d="M100 60 Q105 45 100 30" stroke="#FFB366" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>
  <g class="steam">
    <path d="M130 65 Q135 50 130 35" stroke="#FFB366" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>
  
  <!-- Bubbles -->
  <circle cx="85" cy="75" r="5" fill="#FFD700" class="bubble"/>
  <circle cx="115" cy="70" r="4" fill="#FFA500" class="bubble"/>
  <circle cx="100" cy="80" r="3" fill="#FFB366" class="bubble"/>
  
  <!-- Pot Group -->
  <g class="pot-group">
    <!-- Pot Body -->
    <ellipse cx="100" cy="145" rx="55" ry="15" fill="#8B4513"/>
    <path d="M45 100 C45 140 55 155 100 155 C145 155 155 140 155 100 L155 90 C155 85 150 80 145 80 L55 80 C50 80 45 85 45 90 Z" fill="url(#potGradient)"/>
    
    <!-- Pot Rim -->
    <ellipse cx="100" cy="80" rx="55" ry="12" fill="#CD853F"/>
    <ellipse cx="100" cy="80" rx="48" ry="9" fill="#8B4513"/>
    
    <!-- Handles -->
    <path d="M35 95 C25 95 20 105 20 110 C20 115 25 120 35 120" stroke="#8B4513" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M165 95 C175 95 180 105 180 110 C180 115 175 120 165 120" stroke="#8B4513" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Spoon -->
  <g class="sparkle">
    <ellipse cx="160" cy="120" rx="8" ry="5" fill="#FFD700" transform="rotate(-30 160 120)"/>
    <rect x="158" y="120" width="4" height="35" rx="2" fill="#8B4513" transform="rotate(-30 160 120)"/>
  </g>
  
  <!-- Sparkles -->
  <g class="sparkle" style="animation-delay: 0.2s">
    <path d="M55 50 L58 55 L63 55 L59 58 L61 63 L55 60 L49 63 L51 58 L47 55 L52 55 Z" fill="#FFD700"/>
  </g>
  <g class="sparkle" style="animation-delay: 0.8s">
    <path d="M145 55 L147 58 L150 58 L148 60 L149 63 L145 61 L141 63 L142 60 L140 58 L143 58 Z" fill="#FFD700"/>
  </g>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="potGradient" x1="45" y1="80" x2="155" y2="155">
      <stop offset="0%" stop-color="#CD853F"/>
      <stop offset="50%" stop-color="#8B4513"/>
      <stop offset="100%" stop-color="#654321"/>
    </linearGradient>
    <radialGradient id="bgGradient">
      <stop offset="0%" stop-color="#FFB366"/>
      <stop offset="100%" stop-color="#FF8C00" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>